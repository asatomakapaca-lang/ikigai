<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ikigai</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <div class="container">

        <!-- LEFT SIDE -->

        <div class="left-box">

            <span class="logo">Ikigai</span>

            <img src="png/18881c58-b358-4dc2-85df-933553c94026.png" class="shoe">

            <div class="left-text">
                <h1>
                    a platform <br>
                    for your creativity
                </h1>
            </div>

        </div>

        <!-- RIGHT SIDE -->

        <div class="right-box">

            <div class="form-container">

                <h2>СОЗДАТЬ АККАУНТ</h2>

                <p class="subtitle">
                    Присоединяйтесь к нашей творческой платформе!
                </p>

                <form>

                    <div class="row">

                        <div class="input-box">
                            <i class="fa-regular fa-user"></i>

                            <input type="text"
                            placeholder="First Name">
                        </div>

                        <div class="input-box">
                            <i class="fa-regular fa-user"></i>

                            <input type="text"
                            placeholder="Last Name">
                        </div>

                    </div>

                    <div class="input-box full">
                        <i class="fa-regular fa-envelope"></i>

                        <input type="email"
                        placeholder="Email Address">
                    </div>

                    <div class="input-box full">
                        <i class="fa-solid fa-lock"></i>

                        <input type="password"
                        placeholder="Password">
                    </div>

                    <a href="index.html">
    <button type="button">СОЗДАТЬ АККАУНТ</button>
</a>

                </form>

                <p class="login">
                    Уже есть аккаунт?
                    <a href="#">Login</a>
                </p>

            </div>

        </div>

    </div>

</body>
</html>
